name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never let two deploys of the same branch race each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # onBrokenLinks is "throw", so a broken internal link fails this step.
      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    # Pull requests build only. They never deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # wrangler.jsonc tells Wrangler what to upload and under what name.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: build

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report the deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
